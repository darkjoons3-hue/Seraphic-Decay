name: Build Seraphic Decay

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Compile Seraphic Decay
      run: |
        # Компилируем main.cpp и effects.cpp
        # Флаг /Isrc указывает компилятору, где искать effects.h
        cl.exe /EHsc /O2 /MT /DUNICODE /D_UNICODE /Isrc src/main.cpp src/effects.cpp /link /SUBSYSTEM:WINDOWS user32.lib gdi32.lib winmm.lib gdiplus.lib advapi32.lib /OUT:SeraphicDecay.exe

    - name: Upload Artifacts
      uses: actions/upload-artifact@v3
      with:
        name: SeraphicDecay-Build
        path: SeraphicDecay.exe
